# Config version for compatibility and deprecations
config-version = 2

after-startup-command = [
  'exec-and-forget brew services restart borders',
  'exec-and-forget brew services restart sketchybar'
]

exec-on-workspace-change = [
    '/bin/zsh', '-c',
    '/opt/homebrew/bin/sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]

start-at-login = true

# Normalizations
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 0
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

key-mapping.preset = 'qwerty'

# Mouse follows focus
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Persistent workspaces
persistent-workspaces = ["1", "2", "3", "4", "5", "6", "Q", "W", "E", "R"]

# Callback for mode changes
on-mode-changed = [
    'exec-and-forget sketchybar --trigger aerospace_mode_change'
]

# Monitor Workspace Assignment
[workspace-to-monitor-force-assignment]
1 = 'main'
2 = 'main'
3 = 'main'
4 = 'main'
5 = 'main'
6 = 'main'
Q = ['secondary', 'main']
W = ['secondary', 'main']
E = ['secondary', 'main']
R = ['secondary', 'main']

[gaps]
    inner.horizontal = 3
    inner.vertical =   3
    outer.left =  [
       { monitor."AG326UD" = 3 },
       0
    ]
    outer.bottom =    10
    outer.top = [
        { monitor."AG326UD" = 33 },
        { monitor."P272U PRO" = 33 },
        10,
    ]
    outer.right =      3

[mode.main.binding]
    alt-ctrl-cmd-slash = 'layout tiles horizontal vertical'
    alt-ctrl-cmd-comma = 'layout accordion horizontal vertical'
    alt-shift-f = 'layout floating tiling'

    # Focus
    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    # Move
    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    # Resize/Fullscreen
    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'
    alt-f = 'fullscreen'

    # Workspaces
    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'
    alt-6 = 'workspace 6'
    alt-7 = 'workspace 7'
    alt-q = 'workspace Q'
    alt-w = 'workspace W'
    alt-e = 'workspace E'
    alt-r = 'workspace R'

    # Move node to workspace
    alt-shift-1 = 'move-node-to-workspace 1'
    alt-shift-2 = 'move-node-to-workspace 2'
    alt-shift-3 = 'move-node-to-workspace 3'
    alt-shift-4 = 'move-node-to-workspace 4'
    alt-shift-5 = 'move-node-to-workspace 5'
    alt-shift-6 = 'move-node-to-workspace 6'
    alt-shift-7 = 'move-node-to-workspace 7'
    alt-shift-q = 'move-node-to-workspace Q'
    alt-shift-w = 'move-node-to-workspace W'
    alt-shift-e = 'move-node-to-workspace E'
    alt-shift-r = 'move-node-to-workspace R'

    alt-shift-s = 'exec-and-forget screencapture -i -c'
    alt-tab = 'workspace-back-and-forth'
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    alt-shift-semicolon = 'mode service'

[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main']
    f = ['layout floating tiling', 'mode main']
    backspace = ['close-all-windows-but-current', 'mode main']
    q = ['close', 'mode main']
    c = ['layout floating', 'move-node-to-monitor --focus-follows-window main', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']

# --- Window Routing Rules ---

# Workspace 1: Browsers
[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = 'move-node-to-workspace 1'

# Workspace 2: Development
[[on-window-detected]]
if.app-id = 'com.microsoft.VSCode'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'com.github.wez.wezterm'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'com.jetbrains.rider'
run = 'move-node-to-workspace 2'

# Workspace 3: Game Dev
[[on-window-detected]]
if.app-id = 'org.godotengine.godot'
run = 'move-node-to-workspace 3'

# Workspace 4: Knowledge & Mail
[[on-window-detected]]
if.app-id = 'com.apple.mail'
run = 'move-node-to-workspace 4'

[[on-window-detected]]
if.app-id = 'md.obsidian'
run = 'move-node-to-workspace 4'

[[on-window-detected]]
if.app-id = 'com.electron.logseq'
run = 'move-node-to-workspace 4'

# Workspace 5: AI Assistants
[[on-window-detected]]
if.app-id = 'com.bot.pc.doubao'
run = 'move-node-to-workspace 5'

[[on-window-detected]]
if.app-id = 'com.alibaba.tongyi'
run = 'move-node-to-workspace 5'

# workspace 6: Steam
[[on-window-detected]]
if.app-id = 'com.valvesoftware.steam'
run = 'move-node-to-workspace 6'

# Floating Rules for System Apps
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.ActivityMonitor'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.keychainaccess'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.Passwords'
run = 'layout floating'

[[on-window-detected]]
if.app-id = '2dust.v2rayN'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.soda.music'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.tencent.Lemon'
run = 'layout floating'
