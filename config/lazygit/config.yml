# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/master/schema/config.json
# to skip without creating a new repo
notARepository: skip

# Config relating to the Lazygit UI
gui:
    mainPanelSplitMode: vertical
    showFileTree: false
    nerdFontsVersion: "3"
    border: rounded
    mouseEvents: false
    theme:
        activeBorderColor:
            - "#f9e2af"
            - bold
        inactiveBorderColor:
            - "#a6adc8"
        optionsTextColor:
            - "#89b4fa"
        selectedLineBgColor:
            - "#313244"
        cherryPickedCommitBgColor:
            - "#45475a"
        cherryPickedCommitFgColor:
            - "#f9e2af"
        unstagedChangesColor:
            - "#f38ba8"
        defaultFgColor:
            - "#cdd6f4"
        searchingActiveBorderColor:
            - "#f9e2af"

    authorColors:
        "*": "#b4befe"
git:
    parseEmoji: true
    # for more information.
    pagers:
        - colorArg: always
        - pager: delta --dark --paging=never
    branchLogCmd: git log --color=always --graph --pretty=format:"%C(yellow)%h%Creset%C(cyan)%C(bold)%d%Creset %C(cyan)(%ad)%Creset %C(green)%an%Creset %s" {{branchName}}

# User-configured commands that can be invoked from within Lazygit
customCommands:
    - key: <c-f>
      command: "{{if .SelectedFile.HasUnstagedChanges}} git diff -b {{.SelectedFile.Name}} && read -s -n1 key {{end}}"
      context: files
      description: diff --ignore-space-change
      output: terminal
    - key: <c-l>
      command: git la
      context: global
      description: git la
      output: terminal
