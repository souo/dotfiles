# Herdr Configuration
# Docs: https://herdr.dev/zh-cn/docs/configuration/

onboarding = false

# ===== Terminal Defaults =====
[terminal]
default_shell = "zsh"
shell_mode = "login"
new_cwd = "follow"

# ===== Worktrees =====
[worktrees]
directory = "~/code/worktrees"

# ===== Remote =====
[remote]
manage_ssh_config = true

# ===== Key Bindings =====
[keys]
prefix = "ctrl+b"

# General
help = "prefix+?"
settings = "prefix+s"
detach = "prefix+q"
reload_config = "prefix+shift+r"
workspace_picker = "prefix+w"
goto = "prefix+g"

# Tabs
new_tab = "prefix+c"
rename_tab = "prefix+shift+t"
previous_tab = "prefix+p"
next_tab = "prefix+n"
switch_tab = "prefix+1..9"
close_tab = "prefix+shift+x"

# Workspaces
new_workspace = "prefix+shift+n"
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+d"

# Panes
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
split_vertical = "prefix+\\"
split_horizontal = "prefix+minus"
close_pane = "prefix+x"
zoom = "prefix+z"
resize_mode = "prefix+r"
toggle_sidebar = "prefix+b"
cycle_pane_next = "prefix+tab"
cycle_pane_previous = "prefix+shift+tab"

# Navigate-mode (active only in navigate mode)
navigate_workspace_up = "up"
navigate_workspace_down = "down"
navigate_pane_left = "h"
navigate_pane_down = "j"
navigate_pane_up = "k"
navigate_pane_right = "l"

# Custom commands
[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
width = "80%"
height = "80%"
description = "Open lazygit in popup"

[[keys.command]]
key = "prefix+alt+n"
type = "popup"
command = "nvim"
width = "80%"
height = "80%"
description = "Open nvim in popup"

[theme]
name = "terminal"

[theme.custom]
# 背景与容器（深炭黑）
panel_bg = "#121417"
surface0 = "#1e2228"
surface1 = "#181b20"
surface_dim = "#0d0e11"

# 主色（克制清爽的薄荷青）
accent = "#4ebd9e"

# 边框与叠加层
overlay0 = "#3e4753"
overlay1 = "#586374"

# 文本层
text = "#e1e4ea"
subtext0 = "#a8b1bd"

# 语义与功能色
mauve = "#b07cd6"
green = "#4ebd9e"
yellow = "#e0af68"
red = "#e06c75"
blue = "#61afef"
teal = "#56b6c2"
peach = "#ff9e64"

# ===== UI =====
[ui]
sidebar_width = 28
mouse_capture = true
copy_on_select = true
pane_borders = true
pane_gaps = true
confirm_close = true
prompt_new_tab_name = false
hide_tab_bar_when_single_tab = true

[ui.sidebar.agents]
row_gap = 0
rows = [
    ["state_icon", "agent", "state_text"],
    ["terminal_title_stripped"],
    ["workspace", "tab"],
]

[ui.sidebar.agents.rows_by_agent]
opencode = [
    ["state_icon", "agent", "state_text"],
    ["terminal_title_stripped"],
    ["workspace", "tab"],
]

[ui.sidebar.spaces]
row_gap = 0
rows = [
    ["state_icon", "workspace"],
    ["branch", "git_status"],
]

[ui.toast]
delivery = "herdr"
delay_seconds = 1

[ui.toast.herdr]
position = "bottom-right"

# ===== Sound =====
[ui.sound]
# path = "sounds/notification.mp3"

[ui.sound.agents]
agy = "off"


# ===== Session =====
[session]
resume_agents_on_restore = true

# ===== Experimental =====
[experimental]
pane_history = false
# macOS CJK IME 光标锚点设置
reveal_hidden_cursor_for_cjk_ime = true
cjk_ime_agents = ["claude", "pi", "codex"]
# macOS 前缀模式临时切换为 ASCII 输入法
switch_ascii_input_source_in_prefix = true
